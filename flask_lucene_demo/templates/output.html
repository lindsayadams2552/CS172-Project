<!DOCTYPE html>
<html>
<head>
    <title>Search Results</title>
</head>
<body>
    <h1>Results</h1>
    {% if lucene_output %}
        <ul>
        {% for doc in lucene_output %}
            <li>
                <strong>{{ doc.title }}</strong><br>
                <em>{{ doc.subreddit }}</em><br>
                {{ doc.body }}<br>
                <a href="{{ doc.url }}">View Post</a><br>
                <hr>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No results found.</p>
    {% endif %}
    <a href="/input">Search again</a>
</body>
</html>
