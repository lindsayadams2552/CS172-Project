<!DOCTYPE html>
<html>
<head>
    <title>Reddit Search</title>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet"> -->
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Verdana', sans-serif;
            background-color: #f4f4f4;
            color: white;
        }
        .container {
            text-align: center;
            background-color: #FF5700;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            font-family: Verdana, sans-serif;
        }
        .header {
           display: flex;
           align-items: center;
           justify-content: center;
           gap: 15px;
           margin-bottom: 20px;
        }
        .logo {
           height: 65px;
           width: auto;
           margin-bottom: 15px;
        }
        input[type="text"],
        select,
        input[type="number"] {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 9999px;
            outline: none;
            font-family: Verdana, sans-serif;
            margin: 8px 4px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            margin-top: 12px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: white;
            color: #FF5700;
            font-weight: bold;
        }
        .weight-controls {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .weight-controls label {
            font-size: 14px;
            color: white;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
           <img src="{{ url_for('static', filename='white_reddit_logo.png') }}" alt="Reddit Logo" class="logo">
           <h1>Reddit Lucene Search</h1>
       </div>
       <form action="/output" method="POST">
           <!-- query input -->
           <input type="text" name="query" placeholder="Search Reddit..." required>

           <!-- ranking mode selector -->
           <select name="rank_by" id="rank_by">
               <option value="combined" selected>Combined</option>
               <option value="relevance">Relevance</option>
               <option value="time">Recency</option>
               <option value="votes">Upvotes</option>
           </select>

           <!-- weight sliders for combined mode -->
           <div class="weight-controls">
               <label for="w_relevance">Relevance Wt:</label>
               <input type="number" id="w_relevance" name="w_relevance"
                      value="0.5" min="0" max="1" step="0.1" required>

               <label for="w_time">Time Wt:</label>
               <input type="number" id="w_time" name="w_time"
                      value="0.3" min="0" max="1" step="0.1" required>

               <label for="w_votes">Votes Wt:</label>
               <input type="number" id="w_votes" name="w_votes"
                      value="0.2" min="0" max="1" step="0.1" required>
           </div>

           <button type="submit">Search</button>
       </form>
    </div>
</body>
</html>
