<!DOCTYPE html>
<html>
<head><title>Search Results</title></head>
<body>
  <h2>Search Results:</h2>
  {% for res in results %}
   <div style="margin-bottom: 20px;">
      <h3>{{ res.title }}</h3>
      <p><strong>Score:</strong> {{ res.score }}</p>
      <p><strong>Subreddit:</strong> {{ res.subreddit }}</p>
      <p><strong>Author:</strong> {{ res.username }}</p>
      <p>{{ res.body[:300] }}...</p>
      <a href="https://www.reddit.com{{ res.url }}" target="_blank">Link to Post</a>
     <hr>
   </div>
  {% endfor %}
</body>
</html>
